name: velmora

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: velmora_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
    secrets:
      - postgres_bootstrap_password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U velmora_bootstrap -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  installer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    user: "0:0"
    command: ["uvicorn", "installer_app:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    environment:
      VELMORA_BOOTSTRAP_MODE: ${VELMORA_BOOTSTRAP_MODE:-server}
      VELMORA_SITE_URL: ${VELMORA_SITE_URL}
      VELMORA_INTERNAL_PG_HOST: postgres
      VELMORA_INTERNAL_PG_PORT: "5432"
      VELMORA_INTERNAL_PG_USER: velmora_bootstrap
    volumes:
      - runtime_config:/runtime/config
      - runtime_secrets:/runtime/secrets
      - ${VELMORA_BOOTSTRAP_DIR:-./.bootstrap}:/bootstrap:Z
    expose:
      - "8080"
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "/app/scripts/start_backend.py"]
    environment:
      APP_NAME: Velmora API
      MEDIA_ROOT: /app/media
      MEDIA_URL_PREFIX: /media
      MAX_REQUEST_BODY_BYTES: "10485760"
      PRODUCT_IMAGE_MAX_BYTES: "8388608"
      PRODUCT_IMAGE_MAX_PIXELS: "24000000"
      PRODUCT_IMAGE_MAX_COUNT: "4"
      PRODUCT_IMAGE_WEBP_QUALITY: "88"
      ICON_SVG_MAX_BYTES: "131072"
      ICON_SVG_MAX_ELEMENTS: "300"
      ICON_MAX_COUNT: "200"
      SMTP_PASSWORD_FILE: /run/velmora/secrets/smtp_password
      TELEGRAM_BOT_TOKEN_FILE: /run/velmora/secrets/telegram_bot_token
    volumes:
      - media_data:/app/media
      - runtime_config:/run/velmora/config:ro
      - runtime_secrets:/run/velmora/secrets:ro
    expose:
      - "8000"
    networks:
      - edge
      - data
    depends_on:
      installer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 300
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5173"
      SSR_TRUST_PROXY_HOPS: "1"
      SITE_URL: ${VELMORA_SITE_URL}
      API_SERVER_BASE_URL: http://backend:8000/api/v1
      INSTALLER_SERVER_BASE_URL: http://installer:8080/api/v1/install
      INSTALL_STATE_FILE: /run/velmora/config/installed.json
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      YANDEX_SITE_VERIFICATION: ${YANDEX_SITE_VERIFICATION:-}
      GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-}
      GOOGLE_TAG_MANAGER_ID: ${GOOGLE_TAG_MANAGER_ID:-}
    volumes:
      - runtime_config:/run/velmora/config:ro
    expose:
      - "5173"
    networks:
      - edge
    depends_on:
      installer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      installer:
        condition: service_healthy
      frontend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
  runtime_config:
  runtime_secrets:

secrets:
  postgres_bootstrap_password:
    file: ${VELMORA_BOOTSTRAP_PG_SECRET_FILE:-./.bootstrap/postgres_bootstrap_password}
